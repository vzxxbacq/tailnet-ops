# Example site configuration. Copy to ~/.config/tailnet-ops/site.toml (mode 0600) and edit.
# `tn init` writes this file for you: it asks only for what SSH cannot tell it.
# Addresses here are documentation ranges; host names are placeholders.

[site]
name = "example"
owner_user = "owner"               # Headscale user that owns the tags and personal devices
dns_suffix = "tailnet.internal"    # every host is <name>.<suffix> in every region; short names work too
# entry_ipv4 = "10.255.254.0/24"  # phones' addresses on the phone entries (this is the default)

[regions.cn]                       # one tailnet per region
control_host = "cn-control"        # SSH alias of the machine that runs Headscale
check_from = "cn-probe"            # another host in the region, for external checks
public_ipv4 = "198.51.100.10"      # how clients reach the control plane
# domain = "hs-cn.example.com"    # optional: the login server by name, with a Let's Encrypt certificate that
                                   # every device trusts (no site CA to install). acme.sh proves the name with
                                   # a DNS-01 TXT record through the Cloudflare API: point an A record here,
                                   # DNS only (not proxied); tn control apply asks for an API token once
# agent_domain = "agent-cn.example.com"  # optional, needs domain: tn-agent (MCP for Agents, passkey approvals)
                                   # behind a Cloudflare tunnel; tn agent apply makes the tunnel and record
# agent_port = 18480              # optional: tn-agent's port on the control host's loopback (the default)
listen_ipv4 = "0.0.0.0"            # address Headscale binds; a specific IP on multi-address hosts
port = 9443
stun_port = 3478
# entry_port = 51820              # optional: a WireGuard entry for phones on this UDP port (tn phone)
ipv4_prefix = "100.64.1.0/24"      # one /24 per tailnet, inside 100.64.0.0/10; it appears across a line as 10.255.1.0/24
avoid_prefixes = []                # e.g. provider DNS inside 100.64.0.0/10
derp_region_id = 901
derp_region_code = "cn"
derp_region_name = "CN control"
official_derp = false              # false keeps devices off third-party relays
tags = ["tag:cn-server", "tag:cn-gateway"]

[regions.ovs]
control_host = "ovs-control"
check_from = "ovs-probe"
public_ipv4 = "203.0.113.20"
listen_ipv4 = "203.0.113.20"
port = 9443
stun_port = 3478
ipv4_prefix = "100.64.2.0/24"
avoid_prefixes = []
derp_region_id = 902
derp_region_code = "ovs"
derp_region_name = "OVS control"
official_derp = true
tags = ["tag:ovs-server", "tag:ovs-border"]

# Per-host settings for the hosts above. A machine that only joins is not listed here:
# `tn join` takes it from options or questions (tn join --help).
[hosts.cn-control]                 # optional per-host settings, used when the host joins its tailnet
netfilter_mode = "off"             # tn init sets "off" where the resolvers sit inside 100.64.0.0/10

[hosts.ovs-control]
tailscale_port = 41641             # fixed UDP port for tailscaled, where a provider passes only some ports

[hosts.cn-gateway]
region = "cn"                      # needed for hosts that neither control nor check a region
                                   # tags default to the region's -server tag, plus -gateway for a
                                   # line initiator and -border for a line responder

[hosts.ovs-line]
region = "ovs"

[[lines]]                          # optional dedicated links between regions
name = "line1"
initiator = "cn-gateway"           # the only side allowed to start connections
responder = "ovs-line"
responder_entry_ipv4 = "203.0.113.30"
initiator_public_ipv4 = "198.51.100.40"
one_way = true
keepalive_seconds = 25
port = 11011                       # UDP port of the tunnel on the responder's entry address
tunnel_ipv4 = "192.0.2.0/30"       # .1 initiator, .2 responder; a private /30 outside 100.64.0.0/10
priority = 10                      # lower wins when several lines exist
